<!doctype html>
<html lang="id">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap">
<style>
:root{--bg:#dde4e8;--ink:#1d2127;--yellow:#ffc928;--sign:#0b7a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;overflow:hidden}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 2 / 3));aspect-ratio:2/3;overflow:hidden;border-radius:8px;background:#4aa8e8}

#ctl{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;pointer-events:none}
.pair{display:flex;gap:12px}
.btn{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(20,28,36,.38);color:#fff;font:400 40px/1 Rubik,sans-serif;display:grid;place-items:center;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}

.brk{border-radius:20px;width:96px;font:400 18px Bungee,Impact,sans-serif}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#fff;background:rgba(12,18,24,.6)}

.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;text-align:left}

#ov{padding-top:124px}
input{-webkit-user-select:text;user-select:text}
.inp{width:100%;font:500 18px Rubik,sans-serif;text-align:center;letter-spacing:.1em;text-transform:uppercase;padding:12px;border-radius:10px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff}

#bst{position:absolute;z-index:6;left:12px;top:52px;color:#fff;font:500 13px Rubik,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
#snd{position:absolute;z-index:6;right:12px;top:48px;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(20,28,36,.38);color:#fff;font:400 18px/1 Rubik,sans-serif;padding:0}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
html,body{background:#05080f}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.av{width:36px;height:36px;font-size:13px;background:linear-gradient(135deg,#22d3ee,#3b82f6);box-shadow:0 0 14px rgba(34,211,238,.45)}
.pl>div:last-child{flex:1;min-width:0}
#pn{width:100%;font-size:14px}
.lv{margin-top:4px;gap:8px}
.xb{flex:1;width:auto;height:6px}

#nav{position:absolute;z-index:7;left:0;right:0;bottom:0;display:flex;justify-content:stretch;padding:4px 6px;background:linear-gradient(0deg,rgba(7,11,20,.98),rgba(7,11,20,.86));border-top:1px solid var(--bd)}

#ov{padding:128px 16px 84px;align-items:stretch;text-align:left;gap:12px}
#ov.home{justify-content:flex-start;overflow:hidden;background:linear-gradient(180deg,rgba(7,11,20,.9),rgba(7,11,20,.18) 40%,rgba(7,11,20,.55) 62%,rgba(7,11,20,.96))}

#ov p{max-width:none;margin:0;font-size:13px;color:#b7c4dc;line-height:1.45}
#ov.home #oP{background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;align-self:flex-start;max-width:300px}
#act{max-width:none;gap:10px}
#ov.home #act{margin-top:auto}
.go{border-radius:14px;font-size:16px;padding:14px;background:linear-gradient(180deg,#ffe066,#ffc928);color:#1b1400;box-shadow:0 6px 20px rgba(255,201,40,.25)}
.go.alt{background:var(--gl);color:#fff;border:1px solid var(--bd);box-shadow:none}
.row{background:var(--gl);border:1px solid var(--bd);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.rk,.sm{border-radius:10px}
.mc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:#fff;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(59,130,246,.1)),var(--gl);border:1px solid rgba(34,211,238,.38);border-radius:18px;padding:10px 12px;box-shadow:0 0 18px rgba(34,211,238,.12);cursor:pointer;transition:transform .12s}
.mc .th{width:64px;height:56px}
.mc>svg{width:18px;height:18px;color:#8da0bd;flex:none}
.mi{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mi b{font:700 14px Rubik,sans-serif}.mi small{font-size:11px;color:#9fb0c9}
.mi em{font:700 11px Rubik,sans-serif;font-style:normal;color:#22d3ee}
.tg{align-self:flex-start;font:700 9px Rubik,sans-serif;letter-spacing:.14em;color:#04121a;background:var(--y);border-radius:999px;padding:2px 8px}
.pb{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#ffc928)}
.play{width:100%;height:64px;border:0;border-radius:18px;font:400 26px Bungee,Impact,sans-serif;letter-spacing:.08em;color:#1b1400;background:linear-gradient(180deg,#ffe066,#ffc928 55%,#f5a800);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 8px 26px rgba(255,201,40,.38);display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .12s;cursor:pointer}
.play svg{width:26px;height:26px;fill:#1b1400}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{height:86px;border-radius:16px;color:#fff;background:var(--gl);border:1px solid var(--bd);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 12px Rubik,sans-serif;letter-spacing:.06em;transition:transform .12s;cursor:pointer}
.tile svg{width:24px;height:24px;color:var(--c)}
.tile small{font:500 10px Rubik,sans-serif;color:#9fb0c9;letter-spacing:0}
.play:active,.tile:active,.mc:active,.go:active,.sm:active{transform:scale(.97)}
.btn{position:relative}
.btn::after{content:'';position:absolute;inset:-8px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="c"></canvas>
<div id="hud"><div><small>Nyawa</small><b id="hT">♥♥♥♥♥♥</b></div><div><small>Jarak</small><b id="hD">0 m</b></div><div><small>Koin</small><b id="hC">0</b></div><div><small>Kecepatan</small><b id="hS">0</b></div></div>
<header id="tb"><div class="t1"><div class="lg"><svg width="26" height="26" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M4 32L20 6L36 32H27L20 20L13 32Z" fill="#00C8FF"/><path d="M12 36H28" stroke="#FF6B35" stroke-width="3" stroke-linecap="round"/></svg><div>TOL BALAP<small>RACING</small></div></div>
<div class="t2"><div class="cp"><i></i><span id="hCo">0</span></div>
<div class="pl"><div class="av" aria-hidden="true">NR</div><div><input id="pn" maxlength="14" value="PEMBALAP" aria-label="Nama pemain" autocomplete="off" spellcheck="false"><div class="lv"><b id="hLv">LV 1</b><div class="xb"><i id="hXp"></i></div></div></div></div></div></div>
</header>
<nav id="nav" aria-label="Navigasi"></nav>
<div id="bst"></div><button id="snd" aria-label="Suara">♪</button>
<div id="toast"></div>
<div id="ctl">
<div class="pair"><button class="btn" data-k="l" aria-label="Belok kiri">‹</button><button class="btn" data-k="r" aria-label="Belok kanan">›</button></div>
<button class="btn brk" data-k="b" aria-label="Rem">REM</button>
</div>
<div id="pw"><button class="sm" id="pL"></button><button class="sm" id="pS"></button><button class="sm" id="pN"></button><button class="sm" id="pC"></button></div>
<div id="ov"><h1 id="oT">Tol Balap</h1><p id="oP">Salip mobil di jalan tol sebanyak mungkin tanpa dikejar waktu. Kamu punya 6 nyawa, setiap tabrakan mengurangi satu. Tiap 1.000 m dapat 500 koin. Tahan REM untuk mengerem.</p><div id="act"></div></div>
</div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c');let g=cv.getContext('2d',{alpha:false,desynchronized:true});const W=480;let H=720;cv.width=W;cv.height=H;
const SEG=200,RW=2200,CAMH=1000,DEPTH=.84,DRAW=110,MAX=SEG*55,PZ=1210;let PY=610;
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t*t*(3-2*t);
const segs=[];
let curY=0,lastKd='c',wrnT=0;
function sec(e,h,l,c,hy,kd){const n=e+h+l,y0=curY;for(let i=0;i<n;i++){const k=segs.length;
 const cu=i<e?c*ease(i/e):i<e+h?c:c*ease((n-i)/l);
 const s={i:k,z:k*SEG,curve:cu,cars:[],y:y0+hy*ease(i/n),yn:y0+hy*ease((i+1)/n),kd:kd||'c'};
 if(s.kd==='c'){if(k%4===0)s.tree=(k%8===0?1:-1)*(1.55+((k*37)%10)/12);if(k%6===3)s.lamp=k%12===3?1:-1}
 if(s.kd==='b'&&k%24===0)s.pyl=1;
 segs.push(s)}curY=y0+hy}
[[20,60,20,0,0,'c'],[25,50,25,3,3000,'c'],[20,40,20,0,0,'b'],[25,50,25,-4,-3000,'c'],[15,20,15,2,0,'c'],[10,70,10,0,0,'c'],[15,20,15,-2,0,'c'],[20,80,20,0,2400,'c'],[30,60,30,5,0,'b'],[30,60,30,-5,-2400,'c'],[20,40,20,0,0,'c']].forEach(a=>sec(...a));
const N=segs.length,L=N*SEG;
const cols=['#2e86de','#f5f5f5','#1fa971','#8e44ad','#5d6d7e','#16a0b5'];
const cars=[];for(let k=0;k<36;k++)cars.push({z:0,off:[-.6,0,.6][k%3],sp:MAX*(.22+Math.random()*.25),col:cols[k%cols.length]});
const inp={l:0,r:0,b:0};
let mode='menu',pos=0,speed=0,px=0,lives=6,dist=0,coins=0,nextC=1000,nextM=500,flash=0,shake=0,hitCd=0,skyX=0,best=0,total=0,tt=0;
try{best=+localStorage.getItem('tolbalap-best')||0;total=+localStorage.getItem('tolbalap-koin')||0}catch(e){}
const CARS=[{r:'E',n:'Jago',p:0,m:1,c:'#e8412c'},{r:'D',n:'Lincah',p:3000,m:1.08,c:'#ff8a1c'},{r:'C',n:'Tangkas',p:7500,m:1.16,c:'#2ecc71'},{r:'B',n:'Petir',p:15000,m:1.25,c:'#1e90ff'},{r:'A',n:'Elang',p:30000,m:1.35,c:'#8e44ad'},{r:'S',n:'Badai',p:60000,m:1.45,c:'#e84393'},{r:'SS',n:'Rajawali',p:100000,m:1.57,c:'#1c1f26'},{r:'SSS',n:'Legenda',p:175000,m:1.7,c:'#d4af37'},
{r:'HW',n:'Labu Kilat',p:0,m:1.2,c:'#ff7a00',ev:1},{r:'HW',n:'Kelelawar',p:0,m:1.3,c:'#3b2a63',ev:1},{r:'HW',n:'Hantu Putih',p:0,m:1.45,c:'#eef3ff',ev:1},{r:'HW',n:'Penyihir',p:0,m:1.6,c:'#00b36b',ev:1},{r:'HW',n:'Drakula',p:0,m:1.8,c:'#7a0019',ev:1},
{r:'XM',n:'Rusa Salju',p:0,m:1.2,c:'#8b5a2b',ev:2},{r:'XM',n:'Santa Express',p:0,m:1.3,c:'#d32f2f',ev:2},{r:'XM',n:'Pohon Natal',p:0,m:1.45,c:'#1b8a3a',ev:2},{r:'XM',n:'Kristal Es',p:0,m:1.6,c:'#8fe3ff',ev:2},{r:'XM',n:'Bintang Emas',p:0,m:1.8,c:'#ffd54a',ev:2}];
let inv={l:0,s:0,n:0,x:0},owned=[0],sel=0,tL=0,tS=0,tN=0,tC=0,MAXP=MAX,cur='',red=[],rmsg='';
const CODES={EWILMCGIL:{c:25000},EKOFARMA:{c:50000,l:2},CIHONG:{c:55000,car:4},BISMAULAR:{c:5000000}};
try{const v=JSON.parse(localStorage.getItem('tolbalap-inv')||'{}');inv=v.inv||inv;owned=v.owned||owned;sel=v.sel||0;red=v.red||red}catch(e){}
const persist=()=>{const o=snap();try{localStorage.setItem('tolbalap-save',JSON.stringify(o))}catch(e){}cloud(o)};
const fmt=n=>Math.floor(n).toLocaleString('id-ID');
let tm;function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tm);tm=setTimeout(()=>t.style.opacity=0,1100)}

function start(){if(typeof act!=='undefined'){act.clear();applyCtl()}pos=0;speed=0;px=0;lives=6;dist=0;coins=0;nextC=1000;nextM=500;flash=0;shake=0;hitCd=0;
 cars.forEach(c=>{c.z=8000+Math.random()*(L-12000);c.pd=0});
 mode='play';MAXP=MAX*CARS[sel].m*(1+.04*upL(sel,0));ua=1+.1*upL(sel,1);uh=1+.08*upL(sel,2);ur=1+.1*upL(sel,3);tL=tS=tN=tC=0;lastCr=0;dayCheck();{const o=Object.keys(WXN);wxC=wxP=o[Math.floor(Math.random()*o.length)];wxF=1;wxT=30}$('ov').style.display='none'}
function end(){mode='over';if(typeof act!=='undefined'){act.clear();applyCtl()}const d=Math.floor(dist);let rec=d>best;
 if(rec){best=d;try{localStorage.setItem('tolbalap-best',best)}catch(e){}}
 persist();
